ktor {
    deployment {
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.travelwise.ApplicationKt.module ]
    }
}

api {
    restcountries {
        baseUrl = "https://restcountries.com/v3.1"
    }
    exchangerate {
        baseUrl = "https://open.er-api.com/v6"
    }
    openweather {
        baseUrl = "https://api.openweathermap.org/data/2.5"
        apiKey = ${?OPENWEATHER_API_KEY}
    }
}
